name: Build all platforms
run-name: Build all platforms ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 1.2.3
        required: true
        type: string
      publish_release:
        description: Upload packages to a GitHub release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  auth-preflight:
    name: Verify packaged authentication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Firebase and Google OAuth configuration
        env:
          FIREBASE_CONFIG_JSON_BASE64: ${{ secrets.FIREBASE_CONFIG_JSON_BASE64 }}
        run: |
          test -n "$FIREBASE_CONFIG_JSON_BASE64" || { echo 'FIREBASE_CONFIG_JSON_BASE64 repository secret is required.' >&2; exit 1; }
          node -e "require('fs').writeFileSync('firebase.config.json', Buffer.from(process.env.FIREBASE_CONFIG_JSON_BASE64, 'base64'))"
          node scripts/validate-firebase-config.js firebase.config.json --require-google
          node scripts/verify-auth-config-live.js firebase.config.json

  windows:
    name: Windows x64
    needs: auth-preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare release authentication configuration
        shell: pwsh
        env:
          FIREBASE_CONFIG_JSON_BASE64: ${{ secrets.FIREBASE_CONFIG_JSON_BASE64 }}
        run: |
          if (-not $env:FIREBASE_CONFIG_JSON_BASE64) { throw 'FIREBASE_CONFIG_JSON_BASE64 repository secret is required.' }
          node -e "require('fs').writeFileSync('firebase.config.json', Buffer.from(process.env.FIREBASE_CONFIG_JSON_BASE64, 'base64'))"
          node scripts/validate-firebase-config.js firebase.config.json --require-google
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Set package version
        shell: pwsh
        env:
          BUILD_VERSION: ${{ inputs.version }}
        run: node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json')); p.version=process.env.BUILD_VERSION; fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n')"
      - name: Build Windows setup and portable packages
        run: npm run package:win:app
      - name: Verify packaged authentication configuration
        shell: pwsh
        run: node scripts/validate-firebase-config.js dist/win-unpacked/resources/firebase.config.json --require-google
      - uses: actions/upload-artifact@v4
        with:
          name: DeployerX-Windows-x64
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/*.yml
          if-no-files-found: error

  linux:
    name: Linux x64
    needs: auth-preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install RPM packaging tools
        run: sudo apt-get install --yes --no-install-recommends rpm
      - name: Prepare release authentication configuration
        env:
          FIREBASE_CONFIG_JSON_BASE64: ${{ secrets.FIREBASE_CONFIG_JSON_BASE64 }}
        run: |
          test -n "$FIREBASE_CONFIG_JSON_BASE64" || { echo 'FIREBASE_CONFIG_JSON_BASE64 repository secret is required.' >&2; exit 1; }
          node -e "require('fs').writeFileSync('firebase.config.json', Buffer.from(process.env.FIREBASE_CONFIG_JSON_BASE64, 'base64'))"
          node scripts/validate-firebase-config.js firebase.config.json --require-google
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Set package version
        env:
          BUILD_VERSION: ${{ inputs.version }}
        run: node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json')); p.version=process.env.BUILD_VERSION; fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n')"
      - name: Build Linux packages
        run: npm run package:linux
      - name: Verify packaged authentication configuration
        run: node scripts/validate-firebase-config.js dist/linux-unpacked/resources/firebase.config.json --require-google
      - uses: actions/upload-artifact@v4
        with:
          name: DeployerX-Linux-x64
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.blockmap
            dist/*.yml
          if-no-files-found: error

  mac:
    name: macOS ${{ matrix.arch }}
    needs: auth-preflight
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare release authentication configuration
        env:
          FIREBASE_CONFIG_JSON_BASE64: ${{ secrets.FIREBASE_CONFIG_JSON_BASE64 }}
        run: |
          test -n "$FIREBASE_CONFIG_JSON_BASE64" || { echo 'FIREBASE_CONFIG_JSON_BASE64 repository secret is required.' >&2; exit 1; }
          node -e "require('fs').writeFileSync('firebase.config.json', Buffer.from(process.env.FIREBASE_CONFIG_JSON_BASE64, 'base64'))"
          node scripts/validate-firebase-config.js firebase.config.json --require-google
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Set package version
        env:
          BUILD_VERSION: ${{ inputs.version }}
        run: node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json')); p.version=process.env.BUILD_VERSION; fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n')"
      - name: Build macOS packages
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm run package:mac:${{ matrix.arch }}; then
              exit 0
            fi
            if [[ "$attempt" == "3" ]]; then
              exit 1
            fi
            echo "macOS packaging attempt $attempt failed; cleaning temporary DMG mounts before retrying."
            hdiutil info | awk '/^\/dev\/disk/ && /Apple_HFS/ { print $1 }' | while read -r device; do
              hdiutil detach -force "$device" || true
            done
            rm -rf dist
            sleep 10
          done
      - name: Verify packaged authentication configuration
        run: node scripts/validate-firebase-config.js dist/mac*/DeployerX.app/Contents/Resources/firebase.config.json --require-google
      - uses: actions/upload-artifact@v4
        with:
          name: DeployerX-macOS-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/*.yml
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: ${{ inputs.publish_release }}
    needs: [windows, linux, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          tag="v${BUILD_VERSION}"
          mapfile -d '' files < <(find release-artifacts -type f \( -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' -o -name '*.zip' -o -name 'latest.yml' -o -name '*.exe.blockmap' \) -print0)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --title "DeployerX $tag" --repo "$GITHUB_REPOSITORY"
            gh release upload "$tag" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "${files[@]}" --title "DeployerX $tag" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
