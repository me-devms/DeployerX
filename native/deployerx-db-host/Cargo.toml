[package]
name = "deployerx-db-host"
version = "0.1.0"
description = "Headless built-in database driver host for DeployerX"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77.2"
publish = false

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dependencies]
base64 = "0.22.1"
futures-util = "0.3.31"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "postgres", "mysql", "tls-rustls-ring-native-roots", "chrono", "uuid", "rust_decimal", "json"] }
tokio = { version = "1.49.0", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync"] }
zeroize = "=1.8.2"
